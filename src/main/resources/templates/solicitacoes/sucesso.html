<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitação Enviada - OcupaMais</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/navbar-cidadao :: navbar}"></header>

<main class="container">

    <section class="card-sucesso">

        <div class="icone-sucesso">
            ✓
        </div>

        <h1>Solicitação enviada!</h1>

        <p class="texto-sucesso">
            Seu protocolo:
        </p>

        <div class="protocolo-box">
            <span th:text="${protocolo}">
                PROTOCOLO
            </span>
        </div>

        <p class="texto-sucesso">
            Use esse número para acompanhar o andamento da solicitação.
        </p>

        <hr>

        <h3>O que deseja fazer agora?</h3>

        <div class="acoes-sucesso">
            <a class="botao-home" th:href="@{/solicitacoes/acompanhar}">
                Acompanhar Solicitação
            </a>

            <a class="botao-home" th:href="@{/solicitacoes/nova}">
                Nova Solicitação
            </a>

            <a class="botao-home" th:href="@{/}">
                Voltar ao Início
            </a>
        </div>

    </section>

</main>

</body>
</html>
